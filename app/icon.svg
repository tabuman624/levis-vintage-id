<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="3" fill="#1a2a3a"/>
  <!-- Gold border -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="2" fill="none" stroke="#e8d5a3" stroke-width="0.8" stroke-opacity="0.5"/>
  <!-- V letter -->
  <text x="16" y="21.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#e8d5a3">V</text>
  <!-- Red dot (rivet-like) -->
  <circle cx="23.5" cy="21.5" r="2.2" fill="#c0392b"/>
</svg>
